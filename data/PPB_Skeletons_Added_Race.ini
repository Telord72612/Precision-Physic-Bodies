; ══════════════════════════════════════════════════════════════════════════════════════════════
;  PPB — SKELETON ASSIGNMENT              Precision Physic Bodies · user-editable · read at load
;  (renamed from PPB_Skeletons.ini 2026-07-26 — the old name collided with PPB_skeletons.txt)
; ══════════════════════════════════════════════════════════════════════════════════════════════
;
;  THIS FILE DECIDES WHO GETS A PPB SKELETON. Nothing else does.
;
;  DELETE THIS FILE and every race falls back to its VANILLA (or XPMSE/whatever you installed)
;  skeleton, and PPB goes completely inert on them — the whole capsule system is gated on our
;  bake being present, so an unlisted NPC is simply skipped. That is the intended opt-out.
;
;  ── SECTIONS ──────────────────────────────────────────────────────────────────────────────
;  A section is the PPB skeleton to hand out. Paths are relative to  Data\meshes\  .
;  Add your own section if you build another skeleton — nothing here is hardcoded.
;
;  ── ENTRIES (any number, any order, inside a section) ─────────────────────────────────────
;    race                = <RaceEditorID>              e.g.  race = NordRace
;    npc                 = <LocalFormID>|<Plugin.esp>  maps HER RACE — read the log receipt,
;                                                      it prints how many others share it
;    npcName             = <in-game full name>         e.g.  npcName = Lydia — no FormID needed.
;                                                      Case-insensitive EXACT name match; every
;                                                      matching NPC's race is mapped (a skeleton
;                                                      is race-level, so the log receipt prints
;                                                      how many other NPCs ride along). Careful
;                                                      with generic names ("Bandit" maps every
;                                                      bandit race!).
;    femaleModelContains = <substring>                 EVERY race whose current female skeleton
;                                                      path contains this text. THIS is how you
;                                                      cover hundreds of modded races in 1 line.
;
;  ── PRECEDENCE ────────────────────────────────────────────────────────────────────────────
;  LAST MATCH WINS. Sections are applied top → bottom, so a broad femaleModelContains catch-all
;  near the top can be overridden by a specific `race =` further down (that is exactly how
;  Khajiit peel off the shared beast skeleton below).
;
;  ── WHAT THIS FILE DOES *NOT* CONTROL ─────────────────────────────────────────────────────
;  Tails, wigs and garment/cloth rigs are ADD-ONS. They bind to the bones on the worn mesh, not
;  to our skeleton, so they work even on a vanilla skeleton. M'rissi keeps her tail regardless.
;  Per-NPC capsule overrides (npcCap) and the sculpt gate still live in PPB_skeletons.txt —
;  those are advanced/dial-session tools, not user-facing switches.
;  Auri's antlers ride npcCap head children 15..22, which only EXIST in our skeleton — so she
;  needs to be on a PPB skeleton (she is, via the human catch-all) for them to appear.
; ══════════════════════════════════════════════════════════════════════════════════════════════


; ── DEBUG: CONTACT LOGGING ───────────────────────────────────────────────────────────────────
;  contactLog = 1   writes EVERY touch contact to  My Games\Skyrim VR\SKSE\PPB.log .
;
;  Use it when something is not reacting and you want to know what PPB actually saw. Each line
;  names the NPC, the hand, what touched her, the exact capsule, how deep, and how long:
;
;    API START 1301DE4F R|FINGER|Face(cheek L)|human d=-0.31u dur=0.00s src=GEO curl=9.1u ...
;    API END   1301DE4F R|WEAPON:Iron Rapier|Neck(neck / throat)|human d=-0.71u dur=2.41s src=ENG wpn=Sword/Blade
;
;    src=ENG  the game's own physics reported this collision (exact capsule, true depth)
;    src=GEO  proximity measured by PPB (includes hover — a near-miss still registers)
;    wpn=     the weapon's class and whether it is blade, blunt or piercing
;
;  ⚠ It is VERBOSE — several lines per second while you are touching someone. Fine for a debug
;    session, not something to leave on for normal play. 0 (or removing the line) turns it off.
;    Mod authors: this is the fastest way to see exactly what your mod is being sent.
contactLog = 0


; ── HUMAN / ELF / ORC + every modded race built on the vanilla female skeleton ───────────────
; The catch-all reproduces what PPB used to do by overwriting the vanilla file outright. Remove
; this one line and only the races you list explicitly will get the PPB body.
[Actors\Character\Character Assets Female\PPB\skeleton_female.nif]
femaleModelContains = character assets female\skeleton_female.nif
; exclusive-race followers that ride the human skeleton
race = MRTMrissiRace
race = zzzCrbHalfDragonRace
; ── Custom follower skeletons VERIFIED against ours 2026-07-21 (bone set = strict SUBSET,
;    main-chain proportions identical to <0.01u, so a repoint cannot change their shape).
;    Valestrar and Vyxf ship the BYTE-IDENTICAL file (md5 e9420769).
race = NordRaceJordyn              ; Jordyn - High Poly Head Follower
race = DarkElfRaceValestrar        ; Valestra (Karliah/Brelyna/Jenassa replacer)
race = ImperialRaceVyxf            ; Vyx (Vex replacer)
race = zzzLrhLalanoahAdultRace     ; GLENMORIL - Lalanoah (ADULT form only; child form excluded)
race = NocturnalRace               ; Umbral Embrace - Nocturnal replacer
race = SOS_NanaRace                ; Skyrim on Skooma - Nana (82-bone stripped skeleton; see note)


; ── ARGONIAN (and any race pointing at the shared beast skeleton) ────────────────────────────
[Actors\Character\Character Assets Female\PPB\skeletonbeast_female.nif]
femaleModelContains = skeletonbeast_female.nif


; ── KHAJIIT — must come AFTER the beast catch-all above so it wins (last match wins) ─────────
; This replaces the old PPB.esp race override, which dragged in a plugin master.
[Actors\Character\Character Assets Female\PPB\skeletonbeast_female_khajiit.nif]
race = KhajiitRace
; ⚠ These KHAJIIT races sit on the SHARED vanilla beast skeleton, so the catch-all above would
;   hand them the ARGONIAN file — horns + dorsal ridge baked in. They must be pulled back here.
race = KhajiitRaceVampire
race = DD_MMNQ03KhajiitRaceNoKnockdowns
race = JKJKhajiitAltCathayCatRace
race = JKJKhajiitDagiRaht
race = TeenKhajiitRace
race = TeeenKhajiitRace
race = TeenKhajiitRaceVampire
; Project ja-Kha'jay furstocks — their own skeleton file also ends in skeletonbeast_female.nif,
; so the catch-all grabs them too. Verified subset + identical proportions (the furstock
; difference is in the MESH, not the skeleton), so our Khajiit skeleton is correct for them.
race = JKJKhajiitCathayRaht
race = JKJKhajiitCathayRahtAltLioness
race = JKJKhajiitPahmarRaht


; ── DRAENEI (Yvanni) — horns baked into this file, hooves/breasts via her npcCap lines ───────
[Actors\Character\Character Assets Female\PPB\skeleton_female_draenei.nif]
race = DraeneiRace

; ── MALE HUMANOID (2026-08-18) ────────────────────────────────────────────────────────────────
; PPB's female Havok transplanted onto the XP32 male skeleton: same 19 ragdoll bones, male bone
; tree + male mass/inertia/constraints, female fitted list-shapes. User sculpts from here.
;
; ⚠⚠ THE NEEDLE MUST KEEP THE "character\" PARENT. 31 CREATURE skeletons in this load order end
; in "character assets\skeleton.nif" (dragon, horse, draugr, werewolf, giant, mudcrab, atronachs
; ...). Matching on that tail alone would repoint EVERY ONE of them to a human male skeleton.
; Only actors\character\character assets\skeleton.nif is the humanoid male.
;
; Beast males (skeletonbeast.nif) are deliberately NOT covered — PPB's female beast deletes
; XP32's 5 tail rigid bodies, so a male beast is not a straight copy and has not been built.
;
; NOTE: this assigns the SKELETON only. Male GEOMETRY writers stay refused by the maleGeometry
; gate in PPB_tuning.txt until a male neutral + male UV landmarks exist.
; ── SCULPT SKELETON (2026-08-19) ─────────────────────────────────────────────────────────
; Males currently ride the dedicated SCULPT skeleton, not the shipped one. All in-progress
; dial work is BAKED into sculpt.nif, so it shows correctly with NO knobs and NO sculpt gate.
; When the male is finished: copy sculpt.nif -> PPB\skeleton.nif and restore this header.
; Shipped male (finished geometry):  [Actors\Character\Character Assets\PPB\skeleton.nif]
; 2026-08-22 MALE SHIP: humans males now ride the STRIPPED final skeleton (probes/spares
; structurally removed, 25-child head, 27-child COM). sculpt.nif stays as the dial vehicle
; for the NEXT phase (Khajiit male) and no actor maps to it until that section is added.
; 2026-08-22 KHAJIIT MALE PHASE: beast males ride the sculpt vehicle - khajiit-FEMALE shapes
; + PPB pivots transplanted onto the XP32 beast male base (transplant_beast_*.py, both PASS).
; ARGONIAN males (the beast catch-all) ride the SCULPT vehicle: male body + argonian
; female head (17 children incl. horns/ridge). Dial target.
; ARGONIAN males (beast catch-all) — BAKED 2026-08-22: male body + argonian female head +
; dialled crest (C17-C24) + front neck (C1). Vanilla tail bodies removed (animation-driven,
; useless). sculpt.nif is RETIRED — no section maps to it.
[Actors\Character\Character Assets\PPB\skeletonbeast.nif]
maleModelContains = character assets\skeletonbeast.nif

; KHAJIIT males — BAKED 2026-08-22 (male body + khajiit female head, XP32 tails deleted,
; SMP tail rig binds by bone existence). Listed AFTER the catch-all so it WINS for these
; races; vanilla skeletonbeast.nif serves khajiit AND argonian, so the split must be by RACE.
[Actors\Character\Character Assets\PPB\skeletonbeast_khajiit.nif]
maleRace = KhajiitRace
maleRace = KhajiitRaceVampire
maleRace = DD_MMNQ03KhajiitRaceNoKnockdowns
maleRace = JKJKhajiitAltCathayCatRace
maleRace = JKJKhajiitDagiRaht
maleRace = TeenKhajiitRace
maleRace = TeeenKhajiitRace
maleRace = TeenKhajiitRaceVampire
maleRace = JKJKhajiitCathayRaht
maleRace = JKJKhajiitCathayRahtAltLioness
maleRace = JKJKhajiitPahmarRaht

[Actors\Character\Character Assets\PPB\skeleton.nif]
maleModelContains = character\character assets\skeleton.nif
