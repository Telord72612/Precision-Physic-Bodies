; ═══════════════════════════════════════════════════════════════════════════════
;  PPB.ini — Precision Physic Bodies general settings (born 2026-08-30)
;  HOT FILE: edits apply within ~1 second, no restart. ';' or '#' start a comment.
;  A missing key falls back to the coded default, so lines here can stay sparse.
; ═══════════════════════════════════════════════════════════════════════════════

[Equip]
; A gesture equip onto an OCCUPIED biped slot refuses (piece falls, blocker named)
; instead of the vanilla silent swap. Framework devices (zad/zbf/DOM) never block
; each other — DD arbitrates its own layering.
bSlotOccupiedRefuse=1

; A device is REFUSED when a non-device garment already covers ITS OWN region (per-region, not
; "wearing a body slot": a cuirass must not block a wrist cuff, only gloves do). Framework
; devices (zad/zbf/DOM) never block each other - DD arbitrates its own layering.
;   head 30/31/42 . mouth 44 . neck 45 . torso 32 . hands+arms 33/34 . feet+legs 37/38
;   pelvis/intimate 32/49/52   <- a plug under a dress is refused by this row
bClothingGate=1

[Features]
; ── FOMOD-level feature switches (born 2026-09-11) ────────────────────────────
; These are SHIP switches, not dials: the FOMOD installs one variant of this file.
; Each is ANDed with its existing tuning master, so the knobs still work as dials
; (push/shove also needs `pushStep 1` in PPB_tuning.txt; gestures also need
; `enabled 1`). A missing key = ON, so an upgrade changes nothing for anyone.
; Hot: a saved edit applies within ~1 s for push; the gesture layer arms at load,
; so changing bEquipGestures needs a game restart, not a rebuild.
; The startup receipt "PPB FEATURES:" in PPB.log states the effective answer.

; Push / shove / stagger / knockdown / feet-lift — the whole mechanism. 0 = none of the four below, whatever they say.
bPushShove=1

; ── The four push outcomes (2.2.0). Each only matters while bPushShove=1. Hot, ~1 s. ──
; Push WALK: press an NPC firmly and hold, and she steps back away from your hand until the pressure stops.
bPushWalk=1

; Push STUMBLE: a firm, quick push makes her stagger (the vanilla stagger, turned to face the push).
bPushStumble=1

; Shove KNOCKDOWN: a hard shove knocks her to the ground (ragdoll). With this off and the stumble on, a hard
; shove plays a stumble instead.
bShoveRagdoll=1

; Press-to-equip / two-hand undress / fingertip plug extraction, and the support
; modules that make a gesture-equipped item persist (HoldPool, OutfitGuard).
bEquipGestures=1

; Leg SWEEP knockdown: sweeping or lifting her feet off the floor with your hand or a weapon knocks her down -
; both feet must leave the floor (one leg up does not trip her). Leaning NPCs can still be swept. A sub-feature of
; push/shove - moot when bPushShove=0. Hot, ~1 s. The walk, stumble and shove knockdown are NOT affected.
bFeetLift=1
